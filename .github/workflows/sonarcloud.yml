name: Code Quality — SonarCloud

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  sonarcloud:
    name: SonarCloud Analysis
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Required for SonarCloud blame information

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '9.0.x'

    - name: Cache SonarCloud packages
      uses: actions/cache@v4
      with:
        path: ~/.sonar/cache
        key: ${{ runner.os }}-sonar
        restore-keys: ${{ runner.os }}-sonar

    - name: Cache NuGet packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
        restore-keys: ${{ runner.os }}-nuget-

    - name: Install SonarCloud scanner
      run: dotnet tool install --global dotnet-sonarscanner

    - name: Restore
      run: dotnet restore src/Bank.sln

    - name: Run SonarCloud analysis
      if: secrets.SONAR_TOKEN != ''
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      run: |
        dotnet sonarscanner begin \
          /k:"Bank-Api" \
          /o:"mostafa-said7" \
          /d:sonar.token="$SONAR_TOKEN" \
          /d:sonar.host.url="https://sonarcloud.io" \
          /d:sonar.qualitygate.wait=false \
          /d:sonar.sources="src" \
          /d:sonar.exclusions="**/bin/**,**/obj/**,**/*.Tests/**" \
          /d:sonar.coverage.exclusions="**/bin/**,**/obj/**,**/*.Tests/**"
        dotnet build src/Bank.sln --no-restore --configuration Release
        dotnet test src/Bank.sln --no-build --configuration Release /p:CollectCoverage=true /p:CoverageFormat=opencover
        dotnet sonarscanner end /d:sonar.token="$SONAR_TOKEN"

    - name: Skip SonarCloud (token not configured)
      if: secrets.SONAR_TOKEN == ''
      run: echo "⚠️  SONAR_TOKEN not configured — skipping SonarCloud analysis."
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
